<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173b57"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Expertise – Test</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#173b57;font:18px system-ui}header{background:#173b57;color:white;padding:28px}h1{font-size:25px;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;border-radius:12px;padding:22px;margin-bottom:18px}label{display:block;margin:12px 0 6px}input{width:100%;padding:12px;font:inherit;border:1px solid #899aab;border-radius:6px}output{display:block;font-size:32px;font-weight:bold}small{display:block;margin-top:10px}button{font:inherit;padding:10px;border:1px solid #aaa;border-radius:6px;background:white}</style></head><body><header><h1>EXPERTISE IMMOBILIÈRE</h1>Prototype PWA – données fictives uniquement</header><main><section><label for="ref">Référence fictive</label><input id="ref" value="EXP-TEST-001"><label for="surface">Surface en m²</label><input id="surface" inputmode="decimal" value="500"><label for="prix">Valeur unitaire en €/m²</label><input id="prix" inputmode="decimal" value="2200"></section><section>Valeur calculée<output id="resultat"></output></section><section><div id="save"></div><small id="offline">Préparation du mode hors connexion…</small><small id="network"></small></section></main><script>const fields=['ref','surface','prix'];const el=id=>document.getElementById(id);let warning='';try{let data=JSON.parse(localStorage.getItem('expertise-test-v1')||'null');if(data)fields.forEach(k=>{if(typeof data[k]==='string')el(k).value=data[k]})}catch(e){warning='Lecture du stockage impossible. '}function num(s){s=s.trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return null;let n=Number(s);return Number.isFinite(n)?n:null}function update(){let a=num(el('surface').value),b=num(el('prix').value);el('resultat').textContent=a===null||b===null||!Number.isFinite(a*b)?'Calcul suspendu – données manquantes ou invalides':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(a*b);try{localStorage.setItem('expertise-test-v1',JSON.stringify(Object.fromEntries(fields.map(k=>[k,el(k).value]))));el('save').textContent=warning+'Données de test enregistrées localement.'}catch(e){el('save').textContent='Échec de l’enregistrement local.'}}fields.forEach(k=>el(k).addEventListener('input',update));update();function net(){el('network').textContent=navigator.onLine?'Réseau détecté':'Hors connexion détecté'}window.addEventListener('online',net);window.addEventListener('offline',net);net();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{el('offline').textContent='Cache hors connexion préparé – redémarrage à tester.'}).catch(()=>{el('offline').textContent='Préparation hors connexion impossible.'})}else el('offline').textContent='Mode hors connexion non disponible dans ce navigateur.';</script></body></html>
